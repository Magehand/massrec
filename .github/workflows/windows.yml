name: windows

on:
  push:
  pull_request:

jobs:
  test-unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA headers (cpal)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - run: cargo test --workspace --locked

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM (bindgen for asio-sys)
        run: choco install llvm -y --no-progress
      - name: Tests (sim only)
        run: cargo test --workspace --locked
      # asio-sys can fetch the SDK itself, but its extraction uses Expand-Archive,
      # which breaks on the runner's PowerShell 7. Fetch it here and point at it.
      - name: Fetch ASIO SDK
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\asiosdk.zip"
          $dir = "$env:RUNNER_TEMP\asiosdk"
          Invoke-WebRequest https://www.steinberg.net/asiosdk -OutFile $zip
          New-Item -ItemType Directory -Force $dir | Out-Null
          tar -xf $zip -C $dir
          $h = Get-ChildItem $dir -Recurse -Filter asio.h | Where-Object { $_.Directory.Name -eq 'common' } | Select-Object -First 1
          if (-not $h) { throw "ASIO SDK layout not recognised under $dir" }
          $sdk = $h.Directory.Parent.FullName
          if (-not (Test-Path "$sdk\host\asiodrivers.h")) { throw "asiodrivers.h missing under $sdk" }
          "CPAL_ASIO_DIR=$sdk" >> $env:GITHUB_ENV
      - name: Release build with ASIO
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo build --release --workspace --features masscap-cli/asio,masscap/asio --locked
      - uses: actions/upload-artifact@v4
        with:
          name: masscap-windows-x64
          path: |
            target/release/masscap.exe
            target/release/masscap-cli.exe
