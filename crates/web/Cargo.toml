[package]
name = "masscap"
description = "MASSCAP recorder console (web UI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
chrono = "0.4"
env_logger = "0.11.11"
log = "0.4.34"
masscap-engine = { path = "../engine" }
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tokio-stream = "0.1"

[features]
default = []
asio = ["masscap-engine/asio"]
